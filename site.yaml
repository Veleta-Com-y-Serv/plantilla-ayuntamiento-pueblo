  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que más nos preguntan en la oficina
    preguntas:
      - { pregunta: "¿Cómo me empadrono en Peñarrubia?", respuesta: "Trae tu DNI y un documento que acredite dónde vives (escritura, contrato de alquiler o autorización del propietario). Se hace en el momento, en la oficina o por la sede electrónica." }
      - { pregunta: "¿Puedo hacer trámites sin ir al Ayuntamiento?", respuesta: "Sí. Con certificado digital o Cl@ve puedes presentar instancias, pedir volantes y pagar recibos desde la sede electrónica. Si te atascas, llámanos y te guiamos." }
      - { pregunta: "¿Dónde se aparca para visitar el pueblo?", respuesta: "En el aparcamiento de la entrada, junto a la fuente. El casco antiguo es peatonal salvo para vecinos y carga y descarga." }
      - { pregunta: "¿Cómo reservo el salón social o el pabellón?", respuesta: "Pídelo en la oficina o por correo con una semana de antelación, indicando el día, la hora y para qué lo necesitas." }
      - { pregunta: "¿Hay alojamiento en el pueblo?", respuesta: "Sí, casas rurales y apartamentos. En la oficina de turismo te damos la lista y te ayudamos a encontrar plaza en fiestas." }

